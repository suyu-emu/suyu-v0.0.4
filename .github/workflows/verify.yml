name: 'suyu verify'

on:
  pull_request:
    branches: [ master, dev, metal-dev, fix/dynarmic-vcpkg-msvc-ci ]
    paths:
      - "src/**"
      - "CMakeModules/**"
      - "dist/**"
      - "externals/**"
      - "CMakeLists.txt"
      - "conanfile.txt"
      - ".github/workflows/verify.yml"
      - ".ci/**"
  push:
    branches: [ master, dev, metal-dev ]
    paths:
      - "src/**"
      - "CMakeModules/**"
      - "dist/**"
      - "externals/**"
      - "CMakeLists.txt"
      - "conanfile.txt"
      - ".github/workflows/verify.yml"
      - ".ci/**"
env:
  PR_NUMBER: pr${{ github.event.number }}

jobs:
  format:
    name: 'Verify Format'
    runs-on: ubuntu-latest
    container:
      image: fijxu/build-environments:linux-clang-format
      options: --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$(pwd)"
      - name: 'Verify Formatting'
        run: bash -ex ./.ci/scripts/format/script.sh
  build:
    name: 'test build'
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: clang
            image: linux-fresh
          - type: linux
            image: linux-fresh
          - type: windows
            image: linux-mingw
    container:
      image: fijxu/build-environments:${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up cache
        uses: actions/cache@v4
        id: ccache-restore
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ matrix.type }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.type }}-
      - name: Create ccache directory
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        run: mkdir -p ~/.ccache
      - name: Build
        run: ./.ci/scripts/${{ matrix.type }}/docker.sh
        env:
          ENABLE_COMPATIBILITY_REPORTING: "ON"
      - name: Pack
        run: ./.ci/scripts/${{ matrix.type }}/upload.sh
        env:
          NO_SOURCE_PACK: "YES"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.type }}
          path: artifacts/
  android:
    runs-on: ubuntu-latest
    needs: format
    container: fijxu/build-environments:android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.ccache
          key: ${{ runner.os }}-android-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-
      - name: Query tag name
        uses: olegtarasov/get-tag@v2.1.2
        id: tagName
      - name: Build
        run: ./.ci/scripts/android/build.sh
      - name: Copy and sign artifacts
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: ./.ci/scripts/android/upload.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/
