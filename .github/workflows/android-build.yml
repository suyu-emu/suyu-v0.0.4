name: 'suyu-android-build'

on:
  push:
    tags: [ "*" ]
    branches: ["dev", "fix/dynarmic-vcpkg-msvc-ci", "copilot/**"]
  pull_request:
    branches: ["dev", "fix/dynarmic-vcpkg-msvc-ci"]
  workflow_dispatch: # Allow manual triggers

jobs:
  android:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'suyu-emu/SuyuEclipse' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.ccache
          key: ${{ runner.os }}-android-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Query Tag Name
        uses: olegtarasov/get-tag@v2.1.2
        id: tagName

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache apksigner glslang-dev glslang-tools dos2unix

      - name: Fix Line Endings
        run: dos2unix .ci/scripts/android/build.sh

      - name: Download FFmpeg
        run: |
          mkdir -p externals/ffmpeg-android-v5.1.LTS-aarch64/lib/
          curl -L -o externals/ffmpeg-android-v5.1.LTS-aarch64/lib/libavcodec.so https://github.com/dotintent/videokit-ffmpeg-android/raw/master/videokit/src/main/jniLibs/arm64-v8a/libavcodec.so

      - name: Ensure Gradle Wrapper
        run: chmod +x src/android/gradlew

      - name: Build
        run: ./.ci/scripts/android/build.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}

      - name: Copy Artifacts
        run: ./.ci/scripts/android/upload.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/

  release-android:
    runs-on: ubuntu-latest
    needs: [android]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Query Tag Name
        uses: olegtarasov/get-tag@v2.1.2
        id: tagName

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tagName.outputs.tag }}
          release_name: ${{ steps.tagName.outputs.tag }}
          draft: false
          prerelease: false

      - name: Upload Artifacts to Release
        uses: alexellis/upload-assets@0.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          asset_paths: '["./**/*.apk","./**/*.aab"]'
